<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#242526" media="(prefers-color-scheme: dark)" />
<title>Show It To Me</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <h1>Show It To Me</h1>
    <p class="subtitle">Point your camera at anything and ask.</p>
  </div>
  <p class="status" id="status" role="status" aria-live="polite">Ready</p>
</header>
<main class="container">
  <section class="card camera-card">
    <div class="camera-select" id="cameraSelectWrap">
      <button id="camBack" type="button" class="btn btn-chip" aria-label="Back camera">Back</button>
      <button id="camFront" type="button" class="btn btn-chip" aria-label="Front camera">Front</button>
      <button id="liveToggle" type="button" class="btn btn-live" aria-label="Live voice mode"><span class="mic-icon" aria-hidden="true">🎙</span> Live</button>
    </div>
    <div id="liveBar" class="live-bar" hidden aria-live="polite">
      <span id="liveState" class="live-state">Listening</span>
      <div id="levelMeter" class="level-meter" aria-hidden="true"><div id="levelBar" class="level-bar" style="width:0%"></div></div>
      <button id="stopBtn" type="button" class="btn btn-stop" hidden>Stop</button>
    </div>
    <div id="transcriptBubble" class="transcript-bubble" hidden></div>
    <div id="subtitles" class="subtitles" hidden></div>
    <div class="camera-wrap" id="cameraWrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <img id="preview" alt="Preview" hidden />
      <div id="loading" class="loading" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p class="loading-text">Looking at the photo…</p>
      </div>
      <div id="tapStart" class="tap-start" hidden>
        <button type="button" class="btn btn-primary">Tap to start camera</button>
        <p>Camera needs a tap on iPhone</p>
      </div>
    </div>
    <div id="cameraFallback" class="camera-fallback" hidden>
      <p id="cameraFallbackMsg" class="fallback-msg"></p>
      <button id="fallbackUpload" type="button" class="fallback-link">Choose a photo</button>
    </div>
    <!-- gallery fallback input, kept for hidden test compatibility -->
    <input type="file" id="file" accept="image/*" hidden />
    <!-- hidden legacy controls: no dead controls on screen, kept for test hook compatibility -->
    <div hidden aria-hidden="true">
      <button id="capture" type="button">Take photo</button>
      <button id="retake" type="button">Retake</button>
      <button id="upload" type="button">Choose from gallery</button>
      <select id="cameraSelect" hidden></select>
      <input type="checkbox" id="demoMode" hidden />
    </div>
  </section>

  <section class="card question-card">
    <div class="controls">
      <label for="question" class="visually-hidden">Question</label>
      <input id="question" aria-label="Question" placeholder="" autocomplete="off" />
      <button id="ask" class="btn btn-primary" aria-label="Ask">Ask</button>
      <button id="retryBtn" class="btn btn-secondary" hidden type="button">Retry</button>
    </div>
    <div id="questionHint" class="hint" hidden></div>
    <div id="suggestedChips" class="chips" role="group" aria-label="Suggested questions">
      <button class="chip" type="button" data-q="What is this?">What is this?</button>
      <button class="chip" type="button" data-q="What is that part called?">What is that part called?</button>
      <button class="chip" type="button" data-q="How does this work?">How does this work?</button>
    </div>
  </section>

  <div id="answer" class="answer card" hidden></div>

  <div id="zoomModal" class="zoom-modal" hidden>
    <div class="zoom-backdrop"></div>
    <img id="zoomImg" alt="Zoomed view" />
    <button id="zoomClose" class="btn btn-secondary" type="button">Close</button>
  </div>
</main>
<footer class="footer">
  <p>Show It To Me — Meta hackathon demo • Privacy: images stay on device except for inference</p>
</footer>
<script src="live-audio.js"></script>
<script src="app.js"></script>
</body>
</html>
